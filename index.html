<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Bài tập tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#1e2a3a;--dim:#5a6675;--line:#e6ddcb;--amber:#9a5214;--amber-bg:#f6dcc4;--ok:#16604d;--ok-bg:#ddefe7;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,Arial,sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:36px 16px 64px}
.kicker{color:var(--amber);font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase;margin:0 0 6px}
h1{font-family:"Lora",serif;font-weight:600;font-size:36px;margin:0 0 8px}
.lead{color:var(--dim);margin:0 0 24px}
.item{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0;text-decoration:none;color:inherit}
a.item:hover{border-color:var(--amber)}
.no{flex:none;width:48px;height:48px;border-radius:10px;background:var(--amber-bg);color:var(--amber);font-family:"Lora",serif;font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center}
.body{flex:1;min-width:0}
.body b{font-size:17px}
.meta{color:var(--dim);font-size:14px;margin-top:2px}
.go{flex:none;color:var(--amber);font-weight:700}
.soon{opacity:.6}
.soon .no{background:#f1ece2;color:var(--dim)}
.done{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);margin-left:6px;vertical-align:middle}
footer{margin-top:28px;font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Ôn tập tiếng Anh</p>
  <h1>Bài tập tiếng Anh</h1>
  <p class="lead">Chọn bài để làm. Làm xong sẽ thấy điểm, đáp án và giải thích ngay. Bài nào đã làm sẽ có dấu ✓ (trên máy này).</p>
  <div id="list"></div>
  <footer>Mỗi bài có thể làm lại nhiều lần. Có câu nào chưa hiểu thì hỏi thầy nhé!</footer>
</div>
<script>
/* Thêm bài mới: thêm một dòng vào danh sách này (file: tên file bài tập; để "" nếu chưa mở) */
const LESSONS = [
  { title: "Thì tiếng Anh (Verb Tenses)", detail: "Unit 3 · 30 câu trắc nghiệm · có giải thích", file: "bai-01-thi.html" },
];
const list = document.getElementById('list');
LESSONS.forEach((l, i) => {
  let done = false; try { done = !!localStorage.getItem('done_' + l.file); } catch (e) {}
  const el = document.createElement(l.file ? 'a' : 'div');
  el.className = 'item' + (l.file ? '' : ' soon');
  if (l.file) el.href = l.file;
  el.innerHTML = '<div class="no">' + String(i + 1).padStart(2, '0') + '</div><div class="body"><b>' + l.title + '</b>' + (done ? '<span class="done">✓ Đã làm</span>' : '') +
    '<div class="meta">' + l.detail + '</div></div><div class="go">' + (l.file ? 'Làm bài →' : 'Sắp có') + '</div>';
  list.appendChild(el);
});
</script>
</body>
</html>
